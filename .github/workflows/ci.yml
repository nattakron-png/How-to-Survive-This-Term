name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # ฐานข้อมูลสำหรับ Integration Test (TeamApiTests และ context-load test ต้องใช้)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tournament_test
          POSTGRES_USER: tournament_test
          POSTGRES_PASSWORD: test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tournament_test -d tournament_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # ค่าเดียวกับที่ application.properties อ่านจาก Environment Variable
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tournament_test
      DB_USERNAME: tournament_test
      DB_PASSWORD: test_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
